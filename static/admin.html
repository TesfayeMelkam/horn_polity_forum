<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Horn Polity Forum</title><meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="login" class="login-box hidden">
  <h2 style="font-family:'Playfair Display',serif;margin-top:0">Admin login</h2>
  <form id="login-form" class="stack">
    <input class="input" type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Sign in</button><div class="msg err" id="login-msg"></div>
  </form>
  <p style="font-size:12px;color:var(--muted)">Default password is <code>admin123</code> – change it in Settings after signing in.</p>
  <a href="/" style="font-size:13px;color:var(--accent)">← Back to site</a>
</div>

<div id="panel" class="admin-wrap hidden">
  <div class="row"><h2 style="font-family:'Playfair Display',serif;margin:0">Admin dashboard</h2>
    <span style="margin-left:auto" class="row"><a class="btn btn-ghost" href="/">View site</a><button class="btn btn-ghost" id="logout">Log out</button></span></div>
  <div class="tabs" id="tabs">
    <button class="chip on" data-tab="overview">Overview</button><button class="chip" data-tab="articles">Articles</button>
    <button class="chip" data-tab="slides">Home slider</button><button class="chip" data-tab="documents">Documents</button><button class="chip" data-tab="events">Events</button>
    <button class="chip" data-tab="payments">Payments</button><button class="chip" data-tab="people">Members &amp; subscribers</button>
    <button class="chip" data-tab="messages">Messages</button><button class="chip" data-tab="comments">Comments</button>
    <button class="chip" data-tab="site">Site pages</button><button class="chip" data-tab="settings">Settings</button></div>
  <div id="tab-body"></div>
</div>
<div id="toasts"></div>
<script src="/static/js/admin.js"></script>
</body>
</html>
